# =============================================================
# Log4j 日志配置（实验一 步骤 2.5）
# 目的：把 MyBatis 执行的 SQL、参数绑定、结果行数打进控制台，
#       用于「追踪 SQL 执行 / 核对参数绑定 / 验证结果映射 /
#             定位异常 / 排查性能瓶颈」。
# =============================================================

# 全局日志级别与输出目标
log4j.rootLogger=DEBUG, console

# 控制台输出
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%p] %c - %m%n

# ---- 业务日志（本示例包，便于跟踪工具类行为） ----
log4j.logger.com.lab=DEBUG

# ---- MyBatis SQL 日志 ----
# 只对 Mapper 所在包输出 DEBUG 级 SQL 日志
# 注意：这里不要再写 ", console"——rootLogger 已挂载 console appender，
#       logger 上重复挂载会导致每条 SQL 日志被打印两次。
log4j.logger.com.lab.mapper=DEBUG

log4j.logger.org.mybatis=INFO
log4j.logger.org.apache.ibatis=INFO
log4j.logger.com.baomidou=INFO

# 关闭 iBatis 的 JDBC 冗余日志（保留 SQL 与参数即够用）
log4j.logger.java.sql.Connection=INFO
log4j.logger.java.sql.Statement=DEBUG
log4j.logger.java.sql.PreparedStatement=DEBUG
log4j.logger.java.sql.ResultSet=INFO
